[project]
name = "chainnusa-ml"
version = "0.2.0"
description = "ChainNusa ML service — wallet feature extraction, classifier, anomaly detection, LSTM, SHAP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Faisal Affan" }]
license = { text = "MIT" }

dependencies = [
  # web
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.0",
  # data + ml core
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.2",
  "joblib>=1.4.2",
  # deep learning (CPU build by default — switch to torch+cu* for GPU)
  "torch>=2.4.0",
  # explainability
  "shap>=0.46.0",
  # storage
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "boto3>=1.35.0",
  # tracking + lineage
  "mlflow>=2.16.0",
  # web3 (for ETL fallback)
  "web3>=7.2.0",
  "eth-utils>=5.0.0",
  # logging
  "structlog>=24.4.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-requests>=2.32.0",
  "ipykernel>=6.29.0",
]
nlp = [
  "transformers>=4.44.0",
  "tokenizers>=0.19.0",
  "datasets>=3.0.0",
  "accelerate>=0.34.0",
]
ts = [
  "prophet>=1.1.5",
]
viz = [
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "plotly>=5.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
