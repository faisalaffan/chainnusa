name: Contracts CI

on:
  push:
    branches: [main, master, dev]
    paths:
      - "contracts/**"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "contracts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-test:
    name: Forge Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install OpenZeppelin deps
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.0
        working-directory: contracts

      - name: Show Foundry version
        run: forge --version
        working-directory: contracts

      - name: Run tests
        run: forge test -vv --gas-report
        working-directory: contracts

      - name: Check gas snapshots
        run: |
          if [ -f .gas-snapshot ]; then
            echo "## Gas Snapshot" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat .gas-snapshot >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: contracts

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install OpenZeppelin deps
        run: |
          forge install OpenZeppelin/openzeppelin-contracts@v5.0.0
        working-directory: contracts

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither . --fail-high --checklist --sarif results.sarif || true
        working-directory: contracts
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: contracts/results.sarif
        continue-on-error: true
